server:
  port: 8097
spring:
  application:
    name: forum-service-v2
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/spring-boot-microservices-realm
  datasource:
      url: jdbc:postgresql://localhost:5432/forum-service-v2
      username: postgres
      password: admin
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    format-sql: true